<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MotoristaEspertoAC - Gestão de Lucro e Metas</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Biblioteca para exportar o relatório em PDF -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen p-4 md:p-6 font-sans">
  <div class="max-w-md mx-auto space-y-6" id="app-content">
    
    <!-- Cabeçalho -->
    <header class="flex items-center justify-between border-b border-slate-800 pb-4">
      <div>
        <h1 class="text-2xl font-black text-emerald-400">MotoristaEspertoAC</h1>
        <p class="text-xs text-slate-400">Calculadora e Gestão de Lucro Real</p>
      </div>
      <span class="bg-emerald-500/10 text-emerald-400 text-xs px-2.5 py-1 rounded-full font-bold border border-emerald-500/20">Acre</span>
    </header>

    <!-- Tipo de Veículo -->
    <div class="bg-slate-800/80 p-4 rounded-xl border border-slate-700 space-y-3">
      <label class="block text-xs font-bold text-slate-300 uppercase tracking-wider">Tipo de Veículo</label>
      <div class="grid grid-cols-2 gap-3">
        <button id="btnMoto" onclick="setVeiculo('moto')" class="p-3 rounded-lg border-2 border-emerald-500 bg-emerald-500/10 font-bold text-center text-emerald-400 transition-all">
          🏍️ Moto
        </button>
        <button id="btnCarro" onclick="setVeiculo('carro')" class="p-3 rounded-lg border-2 border-slate-700 bg-slate-900/50 font-bold text-center text-slate-400 transition-all">
          🚗 Carro
        </button>
      </div>
    </div>

    <!-- Formulário de Lançamento de Corrida/Turno -->
    <div class="bg-slate-800/80 p-4 rounded-xl border border-slate-700 space-y-4">
      <h2 class="text-sm font-bold text-slate-200">Novo Lançamento</h2>
      
      <!-- Aplicativos (Apenas os disponíveis no Estado) -->
      <div>
        <label class="block text-xs text-slate-400 mb-1">Selecione o Aplicativo / Origem</label>
        <select id="selectApp" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-slate-100 font-medium focus:border-emerald-500 outline-none">
          <option value="Uber">Uber</option>
          <option value="99">99</option>
          <option value="iFood">iFood</option>
          <option value="99Food">99Food</option>
          <option value="Particular">Particular</option>
        </select>
      </div>

      <div class="grid grid-cols-2 gap-3">
        <div>
          <label class="block text-xs text-slate-400 mb-1">Ganhos Brutos (R$)</label>
          <input type="number" id="valorGanhos" placeholder="0.00" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-slate-100 outline-none focus:border-emerald-500">
        </div>
        <div>
          <label class="block text-xs text-slate-400 mb-1">KM Rodados</label>
          <input type="number" id="kmRodados" placeholder="0" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-slate-100 outline-none focus:border-emerald-500">
        </div>
      </div>

      <button onclick="calcularGanhos()" class="w-full bg-emerald-500 hover:bg-emerald-600 text-slate-950 font-black p-3 rounded-lg transition-all shadow-lg shadow-emerald-500/20">
        Calcular Lucro
      </button>
    </div>

    <!-- Painel de Resultados -->
    <div class="bg-slate-800/80 p-4 rounded-xl border border-slate-700 space-y-3" id="relatorio-secao">
      <h2 class="text-sm font-bold text-slate-200">Resumo de Desempenho</h2>
      <div class="grid grid-cols-2 gap-3">
        <div class="bg-slate-900 p-3 rounded-lg border border-slate-800">
          <p class="text-xs text-slate-400">Lucro Líquido Real</p>
          <p id="lucroLiquido" class="text-xl font-black text-emerald-400">R$ 0,00</p>
        </div>
        <div class="bg-slate-900 p-3 rounded-lg border border-slate-800">
          <p class="text-xs text-slate-400">Custo Estimado (KM)</p>
          <p id="custoKm" class="text-xl font-black text-rose-400">R$ 0,00</p>
        </div>
      </div>

      <!-- Botão para Exportar PDF -->
      <button onclick="gerarPDF()" class="w-full bg-slate-700 hover:bg-slate-600 text-slate-100 font-bold p-2.5 rounded-lg text-sm flex items-center justify-center gap-2 border border-slate-600 transition-all">
        📄 Exportar Relatório em PDF
      </button>
    </div>

  </div>

  <script>
    let veiculoAtual = 'moto';
    // Custo estimado por KM (Ajustado para a realidade local)
    const custosKM = { moto: 0.25, carro: 0.65 };

    function setVeiculo(tipo) {
      veiculoAtual = tipo;
      const btnMoto = document.getElementById('btnMoto');
      const btnCarro = document.getElementById('btnCarro');

      if (tipo === 'moto') {
        btnMoto.className = 'p-3 rounded-lg border-2 border-emerald-500 bg-emerald-500/10 font-bold text-center text-emerald-400 transition-all';
        btnCarro.className = 'p-3 rounded-lg border-2 border-slate-700 bg-slate-900/50 font-bold text-center text-slate-400 transition-all';
      } else {
        btnCarro.className = 'p-3 rounded-lg border-2 border-emerald-500 bg-emerald-500/10 font-bold text-center text-emerald-400 transition-all';
        btnMoto.className = 'p-3 rounded-lg border-2 border-slate-700 bg-slate-900/50 font-bold text-center text-slate-400 transition-all';
      }
    }

    function calcularGanhos() {
      const ganhos = parseFloat(document.getElementById('valorGanhos').value) || 0;
      const km = parseFloat(document.getElementById('kmRodados').value) || 0;
      
      const custoTotal = km * custosKM[veiculoAtual];
      const lucro = ganhos - custoTotal;

      document.getElementById('lucroLiquido').innerText = `R$ ${lucro.toFixed(2)}`;
      document.getElementById('custoKm').innerText = `R$ ${custoTotal.toFixed(2)}`;
    }

    function gerarPDF() {
      const elemento = document.getElementById('app-content');
      const opcoes = {
        margin:       10,
        filename:     'Relatorio_MotoristaEspertoAC.pdf',
        image:        { type: 'jpeg', quality: 0.98 },
        html2canvas:  { scale: 2 },
        jsPDF:        { unit: 'mm', format: 'a4', orientation: 'portrait' }
      };

      html2pdf().set(opcoes).from(elemento).save();
    }
  </script>
</body>
</html>
